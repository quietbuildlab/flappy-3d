name: Deploy arcade component

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: quiet-build/.github/.github/workflows/deploy-arcade-component.yml@f874ec46eb04fef8b85cd95ee6dca62b35e526ec
    with:
      support-sha: f874ec46eb04fef8b85cd95ee6dca62b35e526ec
      cloudflare-project-name: flappy-3d
      prebuild-command: ": # No existing unit-test suite; build and browser gates follow"
      postbuild-command: "pnpm exec playwright test --config playwright.component.config.ts && PLAYWRIGHT_BASE_URL=http://127.0.0.1:5205/ pnpm exec playwright test tests/cream-ui.spec.ts tests/side-camera.spec.ts --config playwright.standalone.config.ts"
      pages-base: /flappy-3d/
      bundle-check-command: bash scripts/bundle-check.sh
      lighthouse-pwa-gate: '0.9'
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

name: Deploy

# Thin caller — the actual build + deploy logic lives in the org's reusable
# workflow at quiet-build/.github so improvements roll out to every project
# at once. See that repo's README for available inputs.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    uses: quiet-build/.github/.github/workflows/deploy-static-site.yml@main
    with:
      bundle-check-command: bash scripts/bundle-check.sh
      lighthouse-pwa-gate: 0.9
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
